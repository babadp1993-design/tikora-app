<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIKORA</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#08080d;color:white;
 font-family:Arial,sans-serif;
}
header{
 padding:17px 20px;display:flex;
 justify-content:space-between;align-items:center;
 background:#101019;
}
.logo{font-size:27px;font-weight:900;color:#a855f7}
header span{color:#ddd;font-size:13px}
.feed{height:calc(100vh - 135px);padding:12px}
.video{
 height:100%;border-radius:18px;
 background:linear-gradient(145deg,#241044,#090912,#55128a);
 display:flex;align-items:center;justify-content:center;
 position:relative;overflow:hidden;
}
.video video{
 width:100%;height:100%;object-fit:cover;
 position:absolute;
}
.placeholder{text-align:center;padding:20px}
.placeholder h2{font-size:35px;color:#d8a5ff}
.placeholder p{color:#ddd}
.actions{
 position:absolute;right:13px;bottom:75px;
 display:flex;flex-direction:column;gap:23px;
 z-index:2;
}
.actions button{
 background:#171323;color:white;border:0;
 border-radius:50%;width:48px;height:48px;
 font-size:23px;cursor:pointer;
}
.actions small{display:block;font-size:11px}
.caption{
 position:absolute;bottom:18px;left:16px;
 z-index:2;font-size:14px;
}
nav{
 position:fixed;bottom:0;width:100%;
 height:65px;background:#101019;
 display:flex;justify-content:space-around;
 align-items:center;border-top:1px solid #292033;
}
nav button{
 background:none;border:0;color:#ddd;
 font-size:12px;cursor:pointer;
}
nav button b{display:block;font-size:21px}
nav .active{color:#bd65ff}
input{display:none}
</style>
</head>
<body>

<header>
 <div class="logo">TIKORA</div>
 <span>Découvre le monde 🌍</span>
</header> 
 
<section id="welcome-screen">
  <div class="welcome-content">
    <h1>Bienvenue sur TIKORA</h1>
    <p>Découvre, partage et crée tes vidéos.</p>

    <button onclick="showSignup()">
      Créer un compte
    </button>

    <button onclick="showLogin()">
      Se connecter
    </button>
  </div>
</section>
<main class="feed">
 <div class="video" id="videoBox">
  <div class="placeholder" id="placeholder">
   <h2>TIKORA</h2>
   <p>La vidéo commence ici.</p>
   <p>Découvre. Partage. Inspire.</p>
  </div>

  <div class="actions">
   <button onclick="like()">❤️<small id="likes">0</small></button>
   <button onclick="comment()">💬<small>Commenter</small></button>
   <button onclick="share()">↗️<small>Partager</small></button>
  </div>

  <div class="caption">
   <b>@TIKORA</b><br>
   Bienvenue dans notre communauté !
  </div>
 </div>
</main>

<input type="file" id="upload" accept="video/*">

<nav>
 <button class="active"><b>⌂</b>Accueil</button>
 <button onclick="discover()"><b>⌕</b>Découvrir</button>
 <button onclick="document.getElementById('upload').click()">
  <b>＋</b>Publier
 </button>
 <button onclick="alert('Notifications bientôt disponibles')">
  <b>♡</b>Activité
 </button>
 <button onclick="alert('Profil bientôt disponible')">
  <b>◉</b>Profil
 </button>
</nav>

<script>
let count=0;
function showSignup(){
  let email=prompt("Entre ton adresse e-mail :");
  if(!email)return;
  let password=prompt("Choisis un mot de passe :");
  if(!password)return;
  alert("Inscription prête pour connexion Firebase !");
}

function showLogin(){
  let email=prompt("Entre ton adresse e-mail :");
  if(!email)return;
  let password=prompt("Entre ton mot de passe :");
  if(!password)return;
  alert("Connexion prête pour Firebase !");
 } 
function like(){
 count++;
 document.getElementById('likes').textContent=count;
}

function comment(){
 let message=prompt("Écris ton commentaire :");
 if(message){
  alert("Commentaire ajouté à la démonstration !");
 }
}

function share(){
 if(navigator.share){
  navigator.share({title:"TIKORA",text:"Découvre TIKORA !"});
 }else{
  alert("Partage bientôt disponible !");
 }
}

function discover(){
 alert("Découvrir les vidéos : bientôt disponible !");
}

document.getElementById('upload').addEventListener('change',function(e){
 const file=e.target.files[0];
 if(!file)return;
 const old=document.querySelector('#videoBox video');
 if(old)URL.revokeObjectURL(old.src);
 const video=document.createElement('video');
 video.src=URL.createObjectURL(file);
 video.controls=true;
 video.autoplay=true;
 video.loop=true;
 document.getElementById('videoBox').appendChild(video);
 document.getElementById('placeholder').style.display='none';
});
</script>

 <script type="module"> 
  import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-storage.js";

  getAuth,

  signInWithEmailAndPassword,

} from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyAA0uJkUUqtbSypdmgLvz3YccLAsXznKfk",
    authDomain: "tikora-79bc0.firebaseapp.com",
    projectId: "tikora-79bc0",
    storageBucket: "tikora-79bc0.firebasestorage.app",
    messagingSenderId: "392391552617",
    appId: "1:392391552617:web:7dbee1e1c022a5e197fcf8",
    measurementId: "G-7CRYEQ12WE"
  };
const app = initializeApp(firebaseConfig);
  const storage = getStorage(app);
const auth = getAuth(app);

window.showSignup = async function() {
  const email = prompt("Ton adresse e-mail :");
  if (!email) return;
  const password = prompt("Choisis un mot de passe (6 caractères minimum) :");
  if (!password) return;

  try {
    await createUserWithEmailAndPassword(auth, email, password);
    alert("Bienvenue sur TIKORA !");
  } catch (error) {
    alert(error.message);
  }
};

window.showLogin = async function() {
  const email = prompt("Ton adresse e-mail :");
  if (!email) return;
  const password = prompt("Ton mot de passe :");
  if (!password) return;

  try {
    await signInWithEmailAndPassword(auth, email, password);
    alert("Connexion réussie !");
  } catch (error) {
    alert(error.message);
  }
};

onAuthStateChanged(auth, user => {
  console.log(user ? "Utilisateur connecté" : "Utilisateur déconnecté");
});
 </script>
</body>
</html>
