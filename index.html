
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090910">
<title>TIKORA - Le monde en vidéos</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090910;color:white;
 font-family:Arial,sans-serif;
}
header{
 display:flex;justify-content:space-between;
 align-items:center;padding:18px;
}
.logo{font-size:30px;font-weight:900;color:#a78bfa}
nav{display:flex;justify-content:space-around;padding:15px}
nav span{font-weight:bold;color:#aaa}
nav span:first-child{color:#a78bfa}
.video{
 height:65vh;margin:10px;border-radius:18px;
 background:linear-gradient(160deg,#35205e,#111122,#251344);
 display:flex;flex-direction:column;
 justify-content:flex-end;padding:20px;
}
.video h2{font-size:24px}
.actions{
 display:flex;justify-content:space-between;
 align-items:center;padding:12px 20px;
}
button{
 background:#8b5cf6;color:white;border:0;
 padding:13px 20px;border-radius:25px;
 font-weight:bold;
}
.bottom{
 position:fixed;bottom:0;width:100%;
 background:#151520;display:flex;
 justify-content:space-around;padding:17px 5px;
}
.bottom span{font-size:13px;color:white}
</style>
</head>
<body>
<header>
 <div class="logo">TIKORA</div>
 <div>🔍　✉️</div>
</header>
<nav>
 <span>Pour toi</span>
 <span>Abonnements</span>
 <span>Tendances</span>
</nav>
<div class="video">
 <div style="font-size:50px">▶️</div>
 <h2>Bienvenue sur TIKORA 🌍</h2>
 <p>Découvre le monde autrement !</p>
 <p>@tikora_officiel</p>
</div>
<div class="actions">
 <span>❤️ 0　💬 0　↗️</span>
 <button>+ Publier</button>
</div>
<div class="bottom">
 <span>🏠 Accueil</span>
 <span>🔎 Découvrir</span>
 <span>➕ Publier</span>
 <span>❤️ Activité</span>
 <span>👤 Profil</span>
</div>
</body>
</html>
